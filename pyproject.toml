[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "__pycache__",
    "logs",
    "docs",
    "build",
    "dist",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

ignore = [
    "E501",   # خط بلند — ruff format مدیریت می‌کنه
    "E402",   # import بعد از کد — FastAPI معمولاً این‌طوری می‌نویسه
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["F401", "F811", "E402"]
"**/conftest.py" = ["F401", "F811"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"